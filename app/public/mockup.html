      #aryp-prototype .aryp-grid-2, #aryp-prototype .aryp-grid-even { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      #aryp-prototype .aryp-layout { grid-template-columns: 1fr; }
      #aryp-prototype .aryp-brand-copy { display: none; }
      #aryp-prototype .aryp-sidebar { border-right: 0; border-bottom: 1px solid var(--aryp-line); }
      #aryp-prototype .aryp-context { display: inline-block; margin-right: 10px; margin-bottom: 9px; }
      #aryp-prototype .aryp-nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #aryp-prototype .aryp-nav button { justify-content: flex-start; }
      #aryp-prototype .aryp-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      #aryp-prototype { border-radius: 12px; }
      #aryp-prototype .aryp-topbar { align-items: flex-start; flex-direction: column; }
      #aryp-prototype .aryp-brand img { max-width: 76vw; }
      #aryp-prototype .aryp-brand-copy { display: none; }
      #aryp-prototype .aryp-top-actions { justify-content: flex-start; }
      #aryp-prototype .aryp-main { padding: 13px; }
      #aryp-prototype .aryp-page-head { flex-direction: column; }
      #aryp-prototype .aryp-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #aryp-prototype .aryp-nav button { align-items: flex-start; }
      #aryp-prototype .aryp-metrics, #aryp-prototype .aryp-grid-3, #aryp-prototype .aryp-form-grid, #aryp-prototype .aryp-kv { grid-template-columns: 1fr; }
      #aryp-prototype .aryp-steps { grid-template-columns: 1fr; }
      #aryp-prototype .aryp-step { border-bottom-width: 1px; border-left: 3px solid var(--aryp-line); }
      #aryp-prototype .aryp-step[aria-current=&quot;step&quot;] { border-left-color: var(--aryp-gold); }
      #aryp-prototype .aryp-step[data-complete=&quot;true&quot;] { border-left-color: var(--aryp-green); }
      #aryp-prototype .aryp-profile, #aryp-prototype .aryp-approval, #aryp-prototype .aryp-report { grid-template-columns: auto minmax(0, 1fr); }
      #aryp-prototype .aryp-profile &gt; :last-child, #aryp-prototype .aryp-approval &gt; :last-child, #aryp-prototype .aryp-report &gt; :last-child { grid-column: 1 / -1; }
      #aryp-prototype .aryp-searchbar { grid-template-columns: 1fr; }
      #aryp-prototype .aryp-policy-row { grid-template-columns: 1fr; }
    }
  &lt;/style&gt;

v class=&quot;aryp-report&quot;&gt;&lt;i class=&quot;aryp-report-icon&quot; data-lucide=&quot;combine&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Rekonsiliasi bank bulanan&lt;/strong&gt;&lt;br&gt;&lt;small class=&quot;aryp-subtle&quot;&gt;Cawangan berbanding penyata bank&lt;/small&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;aryp-button&quot;&gt;Buka&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;aryp-report&quot;&gt;&lt;i class=&quot;aryp-report-icon&quot; data-lucide=&quot;building-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Prestasi konsolidasi francaisor&lt;/strong&gt;&lt;br&gt;&lt;small class=&quot;aryp-subtle&quot;&gt;Perbandingan cawangan, tunai, royalti dan fi iklan&lt;/small&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;aryp-button&quot;&gt;Buka&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;aryp-page&quot; data-page=&quot;admin&quot; hidden&gt;
        &lt;div class=&quot;aryp-panel&quot; style=&quot;margin-bottom:14px&quot;&gt;&lt;div class=&quot;aryp-page-head&quot; style=&quot;margin-bottom:10px&quot;&gt;&lt;div&gt;&lt;h2 style=&quot;margin:0&quot;&gt;Audit &amp; tenant boundary demo&lt;/h2&gt;&lt;small class=&quot;aryp-subtle&quot;&gt;Percubaan lintas skop mesti ditolak dan direkodkan.&lt;/small&gt;&lt;/div&gt;&lt;span id=&quot;aryp-audit-demo-status&quot; class=&quot;aryp-status&quot;&gt;Belum diuji&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;aryp-button aryp-button-danger&quot; data-audit-action=&quot;cross-tenant&quot;&gt;Cuba akses BR-999 dari BR-001&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;aryp-page-head&quot;&gt;&lt;div&gt;&lt;h1&gt;Pentadbiran &amp; polisi pusat&lt;/h1&gt;&lt;p class=&quot;aryp-subtle&quot;&gt;Versi polisi berkuat kuasa, harga emas, had kuasa, pengguna dan kesihatan integrasi.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;aryp-button aryp-button-primary&quot;&gt;Cadang perubahan polisi&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;aryp-alert&quot; role=&quot;note&quot;&gt;&lt;strong&gt;Dataset demo aktif · ARYP-DEMO-SEED-001&lt;/strong&gt; Semua jumlah, identiti, harga, provider dan integrasi di bawah ialah <strong>SINTETIK / SIMULASI</strong>; beberapa rujukan UI menggunakan alias lama untuk keserasian smoke test. Andaian dirujuk dalam &lt;code&gt;ARYP_Assumption_Baseline_v0.1.md&lt;/code&gt; dan mesti diganti selepas keputusan client dimuktamadkan.&lt;/div&gt;
        &lt;div class=&quot;aryp-grid-2&quot;&gt;&lt;div class=&quot;aryp-panel&quot;&gt;&lt;h2&gt;Polisi berkuat kuasa · v1.0&lt;/h2&gt;&lt;div class=&quot;aryp-policy-row&quot;&gt;&lt;div&gt;&lt;strong&gt;Margin pembiayaan&lt;/strong&gt;&lt;br&gt;&lt;small class=&quot;aryp-subtle&quot;&gt;Berdasarkan nilai marhun&lt;/small&gt;&lt;/div&gt;&lt;strong&gt;70%&lt;/strong&gt;&lt;span class=&quot;aryp-status aryp-status-ok&quot;&gt;Aktif&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-policy-row&quot;&gt;&lt;div&gt;&lt;strong&gt;Kadar keuntungan&lt;/strong&gt;&lt;br&gt;&lt;small class=&quot;aryp-subtle&quot;&gt;1% sebulan · pro-rata harian&lt;/small&gt;&lt;/div&gt;&lt;strong&gt;12% setahun&lt;/strong&gt;&lt;span class=&quot;aryp-status aryp-status-ok&quot;&gt;Aktif&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-policy-row&quot;&gt;&lt;div&gt;&lt;strong&gt;Fi &amp; caj&lt;/strong&gt;&lt;br&gt;&lt;small class=&quot;aryp-subtle&quot;&gt;Tempoh tebus ÷ tempoh maksimum&lt;/small&gt;&lt;/div&gt;&lt;strong&gt;2.5% NM&lt;/strong&gt;&lt;span class=&quot;aryp-status aryp-status-warn&quot;&gt;Sahkan hari&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-policy-row&quot;&gt;&lt;div&gt;&lt;strong&gt;Royalti / fi iklan&lt;/strong&gt;&lt;br&gt;&lt;small class=&quot;aryp-subtle&quot;&gt;Daripada kadar keuntungan&lt;/small&gt;&lt;/div&gt;&lt;strong&gt;7.2% / 1.4%&lt;/strong&gt;&lt;span class=&quot;aryp-status aryp-status-ok&quot;&gt;Aktif&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;aryp-stack&quot;&gt;&lt;div class=&quot;aryp-panel&quot;&gt;&lt;h2&gt;Integrasi sistem&lt;/h2&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;API harga emas YAPEIM&lt;/span&gt;&lt;span class=&quot;aryp-status aryp-status-ok&quot;&gt;Sihat&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;BISAS komoditi&lt;/span&gt;&lt;span class=&quot;aryp-status aryp-status-ok&quot;&gt;Sihat&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;IRIS MyKad&lt;/span&gt;&lt;span class=&quot;aryp-status aryp-status-ok&quot;&gt;Peranti 8/8&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;Payment gateway&lt;/span&gt;&lt;span class=&quot;aryp-status aryp-status-warn&quot;&gt;1 webhook lewat&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;One Way SMS / SMTP&lt;/span&gt;&lt;span class=&quot;aryp-status aryp-status-ok&quot;&gt;Sihat&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;Sistem perakaunan&lt;/span&gt;&lt;span class=&quot;aryp-status&quot;&gt;Belum disambung&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;aryp-panel&quot;&gt;&lt;h2&gt;Pengguna &amp; akses&lt;/h2&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;Pengguna aktif&lt;/span&gt;&lt;strong&gt;86&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;Peranan tersuai&lt;/span&gt;&lt;strong&gt;5&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;aryp-list-row&quot;&gt;&lt;span&gt;Akses luar skop ditolak hari ini&lt;/span&gt;&lt;strong&gt;4&lt;/strong&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;aryp-button&quot; style=&quot;margin-top:12px&quot;&gt;Urus RBAC &amp; skop cawangan&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;aryp-prototype&#x27;);
      const navButtons = [...root.querySelectorAll(&#x27;[data-screen]&#x27;)];
      const pages = [...root.querySelectorAll(&#x27;[data-page]&#x27;)];
      const jumpButtons = [...root.querySelectorAll(&#x27;[data-jump]&#x27;)];
      const roleSelect = root.querySelector(&#x27;#aryp-role&#x27;);
      const contexts = {
        teller: { title: &#x27;Cawangan Bangi 01&#x27;, detail: &#x27;Kaunter T02 · Syif pagi&#x27;, heading: &#x27;Selamat datang, Nur Aisyah&#x27;, sub: &#x27;Operasi kaunter untuk Sabtu, 15 Ogos 2026 · 12:18 tengah hari&#x27; },
        manager: { title: &#x27;Cawangan Bangi 01&#x27;, detail: &#x27;Paparan pengurus · Semua kaunter&#x27;, heading: &#x27;Ringkasan cawangan, Ahmad Faiz&#x27;, sub: &#x27;Kelulusan, tunai, inventori dan prestasi operasi hari ini&#x27; },
        franchise: { title: &#x27;Koperasi Maju Berhad&#x27;, detail: &#x27;4 cawangan seliaan&#x27;, heading: &#x27;Prestasi francaisi&#x27;, sub: &#x27;Kedudukan semua cawangan di bawah Koperasi Maju Berhad&#x27; },
        hq: { title: &#x27;YAPEIM Smart Venture&#x27;, detail: &#x27;Semua francaisi &amp; cawangan&#x27;, heading: &#x27;Pemantauan francaisor&#x27;, sub: &#x27;Konsolidasi transaksi, tunai, marhun dan risiko seluruh rangkaian&#x27; }
      };

      function showScreen(name) {
        pages.forEach(page =&gt; { page.hidden = page.dataset.page !== name; });
        navButtons.forEach(button =&gt; {
          if (button.dataset.screen === name) button.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;);
          else button.removeAttribute(&#x27;aria-current&#x27;);
        });
      }
      navButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showScreen(button.dataset.screen)));
      jumpButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showScreen(button.dataset.jump)));
      roleSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
        const context = contexts[roleSelect.value];
        root.querySelector(&#x27;#aryp-context-title&#x27;).textContent = context.title;
        root.querySelector(&#x27;#aryp-context-detail&#x27;).textContent = context.detail;
        root.querySelector(&#x27;#aryp-dashboard-title&#x27;).textContent = context.heading;
        root.querySelector(&#x27;#aryp-dashboard-subtitle&#x27;).textContent = context.sub;
      });
      root.querySelector(&#x27;#aryp-reset-demo&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; window.location.reload());

      const feedback = root.querySelector(&#x27;#aryp-demo-feedback&#x27;);
      let feedbackTimer;
      function announce(message) {
        feedback.textContent = message;
        feedback.hidden = false;
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() =&gt; { feedback.hidden = true; }, 5200);
      }

      const customerFixtureButtons = [...root.querySelectorAll(&#x27;[data-demo-customer]&#x27;)];
      const customerFixtureStatus = root.querySelector(&#x27;#aryp-customer-fixture-status&#x27;);
      const customerRiskStatus = root.querySelector(&#x27;#aryp-customer-risk-status&#x27;);
      const startPawnButton = root.querySelector(&#x27;#aryp-start-pawn&#x27;);
      customerFixtureButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const customerId = button.dataset.demoCustomer;
        const blocked = customerId === &#x27;CUS-005&#x27;;
        customerFixtureStatus.textContent = blocked ? &#x27;CUS-005 · BLACKLIST_REVIEW&#x27; : &#x27;CUS-003 · REPEAT_REVIEW&#x27;;
        customerFixtureStatus.className = `aryp-status ${blocked ? &#x27;aryp-status-danger&#x27; : &#x27;aryp-status-warn&#x27;}`;
        customerRiskStatus.textContent = blocked ? &#x27;Tahan · BLACKLIST_REVIEW&#x27; : &#x27;Semak ulangan · REPEAT_REVIEW&#x27;;
        customerRiskStatus.className = `aryp-status ${blocked ? &#x27;aryp-status-danger&#x27; : &#x27;aryp-status-warn&#x27;}`;
        startPawnButton.disabled = blocked;
        announce(blocked ? &#x27;CUS-005 ditahan. Risk hold BLACKLIST_REVIEW menghalang permulaan gadaian dan event penolakan direkodkan.&#x27; : &#x27;CUS-003 dimuatkan. Repeat customer memerlukan semakan tambahan sebelum gadaian.&#x27;);
      }));
      const misplacedAuctionPanel = root.querySelector(&#x27;[data-page=&quot;customers&quot;] [data-auction-action]&#x27;)?.closest(&#x27;.aryp-panel&#x27;);
      if (misplacedAuctionPanel) misplacedAuctionPanel.remove();
      const auctionDemoStatus = root.querySelector(&#x27;#aryp-auction-demo-status&#x27;);
      root.querySelectorAll(&#x27;[data-auction-action]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const action = button.dataset.auctionAction;
        const surplus = action === &#x27;surplus&#x27;;
        const overdue = action === &#x27;overdue&#x27;;
        auctionDemoStatus.textContent = overdue ? &#x27;PLG-003 · OVERDUE_SIMULATED&#x27; : (surplus ? &#x27;AUC-001 · SURPLUS_SIMULATED RM350&#x27; : &#x27;AUC-002 · SHORTFALL_REVIEW_SIMULATED RM250&#x27;);
        auctionDemoStatus.className = `aryp-status ${overdue || surplus ? &#x27;aryp-status-ok&#x27; : &#x27;aryp-status-danger&#x27;}`;
        announce(overdue ? &#x27;PLG-003 dimajukan ke overdue simulasi. Timer notis dan settlement sebenar kekal dinyahaktifkan.&#x27; : (surplus ? &#x27;AUC-001 dipaparkan: lebihan simulasi RM350.00. Refund sebenar dinyahaktifkan.&#x27; : &#x27;AUC-002 dipaparkan: shortfall simulasi RM250.00. Kutipan sebenar dinyahaktifkan.&#x27;));
      }));
      const auditDemoStatus = root.querySelector(&#x27;#aryp-audit-demo-status&#x27;);
      root.querySelectorAll(&#x27;[data-audit-action]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        auditDemoStatus.textContent = &#x27;DENIED · AUD-0007 direkodkan&#x27;;
        auditDemoStatus.className = &#x27;aryp-status aryp-status-danger&#x27;;
        announce(&#x27;Akses BR-999 ditolak kerana tenant boundary. Event AUD-0007 direkodkan dengan actor, scope dan sebab.&#x27;);
      }));
      const vaultDemoStatus = root.querySelector(&#x27;#aryp-vault-demo-status&#x27;);
      root.querySelectorAll(&#x27;[data-vault-action]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const stocktake = button.dataset.vaultAction === &#x27;stocktake&#x27;;
        vaultDemoStatus.textContent = stocktake ? &#x27;STK-001 · 4/4 dipadankan&#x27; : &#x27;DENIED · dual control diperlukan&#x27;;
        vaultDemoStatus.className = `aryp-status ${stocktake ? &#x27;aryp-status-ok&#x27; : &#x27;aryp-status-danger&#x27;}`;
        announce(stocktake ? &#x27;Stocktake STK-001 selesai: 4 item fixture dipadankan, varians sifar dan snapshot disimpan.&#x27; : &#x27;Check-out ditolak. Dual control, actor dan sebab wajib sebelum pergerakan vault.&#x27;);
      }));
      const reportDemoStatus = root.querySelector(&#x27;#aryp-report-demo-status&#x27;);
      root.querySelectorAll(&#x27;[data-report-action]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const target = button.dataset.reportAction;
        const labels = { franchise: &#x27;FR-001 · 2 cawangan demo&#x27;, branch: &#x27;BR-001 · 4 pledge demo&#x27;, pledge: &#x27;PLG-001 · RM2,730 simulasi&#x27; };
        reportDemoStatus.textContent = labels[target];
        reportDemoStatus.className = &#x27;aryp-status aryp-status-ok&#x27;;
        announce(`Drill-down demo dibuka: ${labels[target]}. Skop tenant dan data sintetik dikekalkan.`);
      }));

      const formatter = new Intl.NumberFormat(&#x27;ms-MY&#x27;, { style: &#x27;currency&#x27;, currency: &#x27;MYR&#x27; });
      const stepButtons = [...root.querySelectorAll(&#x27;[data-step]&#x27;)];
      const stepContents = [...root.querySelectorAll(&#x27;[data-step-content]&#x27;)];
      const back = root.querySelector(&#x27;#aryp-step-back&#x27;);
      const next = root.querySelector(&#x27;#aryp-step-next&#x27;);
      const weight = root.querySelector(&#x27;#aryp-weight&#x27;);
      const stone = root.querySelector(&#x27;#aryp-stone-weight&#x27;);
      const price = root.querySelector(&#x27;#aryp-gold-price&#x27;);
      const grade = root.querySelector(&#x27;#aryp-gold-grade&#x27;);
      const seal = root.querySelector(&#x27;#aryp-seal&#x27;);
      const requested = root.querySelector(&#x27;#aryp-requested&#x27;);
      const signature = root.querySelector(&#x27;#aryp-customer-signature&#x27;);
      const payoutButton = root.querySelector(&#x27;#aryp-confirm-payout&#x27;);
      const vaultButton = root.querySelector(&#x27;#aryp-confirm-vault&#x27;);
      const externalVaultButton = root.querySelector(&#x27;#aryp-vault-accept-0042&#x27;);
      const lockedAfterPayout = [weight, stone, price, grade, seal, requested, root.querySelector(&#x27;#aryp-item-type&#x27;), root.querySelector(&#x27;#aryp-payout&#x27;), root.querySelector(&#x27;#aryp-term&#x27;), root.querySelector(&#x27;#aryp-purpose&#x27;)];
      const step1Checks = [...root.querySelectorAll(&#x27;[data-step-content=&quot;1&quot;] input[type=&quot;checkbox&quot;]&#x27;)];
      const step4Checks = [...root.querySelectorAll(&#x27;[data-step-content=&quot;4&quot;] input[type=&quot;checkbox&quot;]&#x27;)];
      let currentStep = 1;
      let maxUnlocked = 1;
      let currentMaximum = 0;
      let requestedValid = false;
      let requestedAmount = 2730;
      let paymentConfirmed = false;
      let vaultConfirmed = false;
      let transactionComplete = false;

      function isStepValid(step) {
        if (step === 1) return step1Checks.every(input =&gt; input.checked);
        if (step === 2) {
          const gross = Number(weight.value || 0);
          const deduction = Number(stone.value || 0);
          return gross &gt; 0 &amp;&amp; deduction &gt;= 0 &amp;&amp; deduction &lt; gross &amp;&amp; Number(price.value || 0) &gt; 0 &amp;&amp; seal.value.trim().length &gt; 0;
        }
        if (step === 3) return requestedValid;
        if (step === 4) return step4Checks.every(input =&gt; input.checked);
        if (step === 5) return paymentConfirmed &amp;&amp; vaultConfirmed;
        return false;
      }

      function updateNextState() {
        next.textContent = currentStep === 5 ? &#x27;Selesaikan transaksi&#x27; : &#x27;Seterusnya&#x27;;
        next.disabled = !isStepValid(currentStep);
      }

      function showStep(number) {
        const target = Math.max(1, Math.min(5, Number(number)));
        if (target &gt; maxUnlocked) {
          announce(`Lengkapkan langkah ${maxUnlocked} sebelum meneruskan.`);
          return;
        }
        currentStep = target;
        stepButtons.forEach(button =&gt; {
          const step = Number(button.dataset.step);
          button.disabled = step &gt; maxUnlocked;
          if (step === currentStep) button.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
          else button.removeAttribute(&#x27;aria-current&#x27;);
          button.dataset.complete = String(step &lt; currentStep &amp;&amp; isStepValid(step));
        });
        stepContents.forEach(content =&gt; { content.hidden = Number(content.dataset.stepContent) !== currentStep; });
        back.disabled = currentStep === 1;
        if (!paymentConfirmed) {
          const waitingForPayment = currentStep === 5;
          root.querySelector(&#x27;#aryp-pawn-status&#x27;).textContent = waitingForPayment ? &#x27;Diluluskan · menunggu bayaran&#x27; : &#x27;Diluluskan · menunggu tandatangan&#x27;;
          root.querySelector(&#x27;#aryp-dashboard-0042-status&#x27;).textContent = waitingForPayment ? &#x27;Menunggu bayaran&#x27; : &#x27;Menunggu tandatangan&#x27;;
        }
        updateNextState();
      }

      function invalidateFrom(step) {
        if (!isStepValid(step)) maxUnlocked = Math.min(maxUnlocked, step);
        showStep(currentStep);
      }

      function completeTransaction() {
        if (!isStepValid(5) || transactionComplete) return;
        transactionComplete = true;
        const dashboardStatus = root.querySelector(&#x27;#aryp-dashboard-0042-status&#x27;);
        dashboardStatus.textContent = &#x27;Selesai&#x27;;
        dashboardStatus.classList.remove(&#x27;aryp-status-warn&#x27;);
        dashboardStatus.classList.add(&#x27;aryp-status-ok&#x27;);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

<script>
(() => {
  const frame = document.getElementById('aryp-ui-frame');
  const api = async (path, options = {}) => {
    const role = frame.contentDocument?.querySelector('#aryp-role')?.value || 'teller';
    const response = await fetch(path, { ...options, headers: { 'content-type': 'application/json', 'x-demo-role': role, ...(options.headers || {}) } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'request_failed');
    return data;
  };
  const announce = (message) => {
    const doc = frame.contentDocument;
    const feedback = doc?.querySelector('#aryp-demo-feedback');
    if (feedback) { feedback.textContent = message; feedback.hidden = false; setTimeout(() => { feedback.hidden = true; }, 4200); }
  };
  window.addEventListener('message', async (event) => {
    const message = event.data;
    if (event.source !== frame.contentWindow || !message || message.type !== 'aryp-api-request') return;
    if (typeof message.requestId !== 'string' || !/^[A-Za-z0-9._:-]{1,120}$/.test(message.requestId)) return;
    try {
      const readAction = message.action === 'get_session' || message.action === 'get_audit';
      const readPath = message.action === 'get_audit' ? '/api/audit' : '/api/session';
      const response = await fetch(readAction ? readPath : '/api/actions', { method: readAction ? 'GET' : 'POST', headers: { 'content-type': 'application/json', 'x-demo-role': message.role || 'EXECUTIVE', 'x-correlation-id': message.requestId }, body: readAction ? undefined : JSON.stringify({ action: message.action, ...(message.payload || {}) }) });
      const data = await response.json();
      frame.contentWindow.postMessage({ type: 'aryp-api-response', requestId: message.requestId, ok: response.ok, data, error: data.error }, '*');
    } catch (error) {
      frame.contentWindow.postMessage({ type: 'aryp-api-response', requestId: message.requestId, ok: false, error: error.message }, '*');
    }
  });
  const wire = () => {
    const doc = frame.contentDocument;
    if (!doc || doc.documentElement?.dataset.apiWired === 'true') return;
    if (doc.documentElement) doc.documentElement.dataset.apiWired = 'true';
    const button = (selector, action, payload = {}) => doc.querySelector(selector)?.addEventListener('click', async () => {
      try { await api('/api/actions', { method: 'POST', body: JSON.stringify({ action, ...payload }) }); announce('API simulasi berjaya: ' + action); }
      catch (error) { announce('API simulasi ditolak: ' + error.message); }
    });
    button('[data-screen="approvals"] [data-approval-decision="Diluluskan"]', 'approve_pledge', { pledgeId: 'PLG-001' });
    button('#aryp-confirm-payout', 'cash_out', { amount: 2730 });
    button('#aryp-confirm-vault', 'vault_checkin', { pledgeId: 'PLG-001' });
    button('#aryp-payment-submit', 'redemption', { pledgeId: 'PLG-002' });
    doc.querySelectorAll('[data-auction-action="surplus"], [data-auction-action="shortfall"]').forEach((node) => node.addEventListener('click', () => api('/api/actions', { method: 'POST', body: JSON.stringify({ action: 'auction_result', result: node.dataset.auctionAction }) }).then(() => announce('API simulasi berjaya: ' + node.dataset.auctionAction)).catch((error) => announce('API simulasi ditolak: ' + error.message))));
    doc.querySelector('[data-auction-action="overdue"]')?.addEventListener('click', () => api('/api/actions', { method: 'POST', body: JSON.stringify({ action: 'auction_overdue' }) }).then(() => announce('API simulasi berjaya: overdue')).catch((error) => announce('API simulasi ditolak: ' + error.message)));
    doc.querySelector('[data-audit-action="cross-tenant"]')?.addEventListener('click', () => api('/api/actions', { method: 'POST', body: JSON.stringify({ action: 'tenant_probe' }) }).then(() => announce('API simulasi berjaya')).catch((error) => announce('API simulasi ditolak: ' + error.message)));
    doc.querySelector('#aryp-reset-demo')?.addEventListener('click', () => api('/api/reset', { method: 'POST' }).then(() => announce('API demo direset')).catch((error) => announce('API reset gagal: ' + error.message)));
  };
  frame.addEventListener('load', wire);
  wire();
})();
</script>
